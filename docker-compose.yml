name: projeto-cqrs
services:
    sqlserver:
        hostname: db_sqlserver
        image: mcr.microsoft.com/mssql/server:2025-latest
        volumes:
            - vol_sqlserver:/var/opt/mssql:rw
        ports:
            - 1433:1433
        environment:
            - ACCEPT_EULA=Y
            - MSSQL_SA_PASSWORD=Mudar2025+
            - MSSQL_PID=Express
            - MSSQL_DB=AppData
        healthcheck:
            test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Mudar2025+", "-Q", "SELECT 1", "-C"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - projeto_cqrs_net

    rabbit:
        hostname: app_rabbit
        image: rabbitmq:4-management-alpine
        volumes:
            - vol_rabbitmq:/var/lib/rabbitmq:rw
        ports:
            - 5672:5672
            - 15672:15672
        environment:
            - RABBITMQ_DEFAULT_USER=root
            - RABBITMQ_DEFAULT_PASS=Mudar2025+
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 8s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - projeto_cqrs_net

    mongo:
        hostname: app_mongo
        image: mongo:8
        volumes:
            - vol_mongo:/data/db:rw
        ports:
            - 27017:27017
        environment:
            - MONGO_INITDB_ROOT_USERNAME=root
            - MONGO_INITDB_ROOT_PASSWORD=Mudar2025+
            - MONGO_INITDB_DATABASE=app
        healthcheck:
            test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/app --quiet
            interval: 8s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - projeto_cqrs_net

    api:
        hostname: api_cotador
        image: app_cotador:0.0.87
        build:
            context: .
            dockerfile: ./src/AppApi/Dockerfile
            tags:
                - "app_cotador:0.0.87"
        depends_on:
            sqlserver:
                condition: service_healthy
                restart: true
            rabbit:
                condition: service_healthy
                restart: true
        ports:
            - 8080:8080
            - 8084:8084
        environment:
            - CONNECTION=Server=db_sqlserver;Database=AppData;User Id=sa;Password=Mudar2025+;TrustServerCertificate=True;ConnectRetryInterval=5;ConnectRetryCount=5;
            - AppConnectionString=Server=db_sqlserver,1433;Database=AppData;User Id=sa;Password=Mudar2025+;TrustServerCertificate=True;
            - RABBITMQ_DEFAULT_USER=root
            - RABBITMQ_DEFAULT_PASS=Mudar2025+
            - RABBITMQ_DEFAULT_HOST=app_rabbit
            - ASPNETCORE_ENVIRONMENT=Development
        networks:
            - projeto_cqrs_net

    worker:
        hostname: app_worker
        image: app_worker:0.0.87
        build:
            context: .
            dockerfile: ./src/AppWorker/Dockerfile
            tags:
                - "app_worker:0.0.87"
        depends_on:
            rabbit:
                condition: service_healthy
                restart: true
            mongo:
                condition: service_healthy
                restart: true
        environment:
            - RABBITMQ_DEFAULT_USER=root
            - RABBITMQ_DEFAULT_PASS=Mudar2025+
            - RABBITMQ_DEFAULT_HOST=app_rabbit
            - MongoConnectionString=mongodb://root:Mudar2025+@app_mongo:27017/app?authSource=admin
        networks:
            - projeto_cqrs_net
networks:
    projeto_cqrs_net:
volumes:
    vol_rabbitmq:
    vol_mongo:
    vol_sqlserver: